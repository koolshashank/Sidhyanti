services:
  # Node/Express API (webapp/server) -- connects to the same production
  # SQL Server database the PHP web CRM and mobile app already use.
  - type: web
    name: sidhyanti-webapp-api
    runtime: node
    plan: free
    rootDir: webapp/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL_HOURS
        value: "8"
      - key: CORS_ORIGIN
        value: https://sidhyanti-webapp.onrender.com

  # React admin UI (webapp/client), served as a static site. /api and
  # /uploads requests are rewritten to the API service above so the app's
  # existing relative baseURL ('/api') keeps working without any code change.
  - type: web
    name: sidhyanti-webapp
    runtime: static
    rootDir: webapp/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sidhyanti-webapp-api.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://sidhyanti-webapp-api.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
